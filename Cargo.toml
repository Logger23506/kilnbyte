[package]
name = "kilnbyte"
version = "0.1.0"
edition = "2021"
description = "Kilnbyte (KBY): Bitcoin-style proof-of-work with Solana-style ~400ms blocks"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
bs58 = "0.5"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
